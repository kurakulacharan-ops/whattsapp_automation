name: Build and publish Docker images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image names
        shell: bash
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Validate deployment configuration
        run: |
          cp deploy/runtime.env.example deploy/runtime.env
          docker compose -f deploy/docker-compose.production.yml config --quiet
          docker compose --env-file deploy/build.env.example -f deploy/docker-compose.production.yml -f deploy/docker-compose.build.yml config --quiet
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Test backend image
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
        run: |
          docker run --rm --entrypoint sh \
            -v "$GITHUB_WORKSPACE/backend/tests:/tests:ro" \
            -e DB_BACKEND=mssql -e LIVENESS_MIN_FACE_RATIO=0.07 \
            "$BACKEND_IMAGE" -c \
            'python -m pip install "pytest>=8,<10" && PYTHONPATH=/app python -m pytest /tests -q -p no:cacheprovider'
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish matching image versions
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_PREFIX-backend:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX-frontend:$IMAGE_TAG"
      - name: Prepare deployment bundle
        if: github.event_name != 'pull_request'
        run: |
          mkdir deployment
          cp deploy/docker-compose.production.yml deployment/compose.yml
          cp deploy/nginx.conf deploy/runtime.env.example deploy/inspect-server.ps1 deployment/
          cp PRODUCTION_DEPLOYMENT.md deployment/README.md
          printf 'IMAGE_PREFIX=%s\nIMAGE_TAG=%s\n' "$IMAGE_PREFIX" "$IMAGE_TAG" > deployment/.env
      - name: Upload deployment files
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: attendance-deployment-${{ github.sha }}
          path: deployment/
          include-hidden-files: true
          retention-days: 90
      - name: Deployment summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '### Published images'
            echo "- $IMAGE_PREFIX-backend:$IMAGE_TAG"
            echo "- $IMAGE_PREFIX-frontend:$IMAGE_TAG"
            echo 'Download the deployment artifact and follow its README on the server.'
            echo 'Production secrets remain on the server. This workflow does not deploy remotely.'
          } >> "$GITHUB_STEP_SUMMARY"

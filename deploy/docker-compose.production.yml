name: attendance

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  env_file: ../backend/.env
  environment: &backend-environment
    ENVIRONMENT: production
    DB_BACKEND: mssql
    REDIS_URL: redis://redis:6379/0
    LIVENESS_MIN_FACE_RATIO: "0.07"
  restart: unless-stopped
  networks: [attendance]

services:
  backend:
    <<: *backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); assert r.get('status') == 'ok' and r.get('mssql') is True and r.get('redis') is True"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  worker:
    <<: *backend
    command: [python, -m, app.worker]
    depends_on:
      backend:
        condition: service_healthy

  absence-worker:
    <<: *backend
    command: [python, -m, app.absence_worker]
    depends_on:
      backend:
        condition: service_healthy

  notification-worker:
    <<: *backend
    command: [python, -m, app.notification_worker]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    networks: [attendance]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    networks: [attendance]

  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes", --save, "60", "1000"]
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [attendance]

networks:
  attendance:
    driver: bridge

volumes:
  redis-data:

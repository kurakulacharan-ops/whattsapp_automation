name: attendance-fresh

x-backend: &backend
  image: attendance-fresh-backend:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  env_file:
    - ./.env.docker-local
    - ../backend/.env
  environment:
    ENVIRONMENT: development
    DB_BACKEND: mssql
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: http://localhost:8082,http://127.0.0.1:8082
  volumes:
    - face-models:/root/.insightface
  restart: unless-stopped

services:
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    <<: *backend
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; r=json.load(urllib.request.urlopen('http://localhost:8000/health')); assert r['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    depends_on:
      backend: {condition: service_healthy}
  absence-worker:
    <<: *backend
    command: [python, -m, app.absence_worker]
    depends_on:
      backend: {condition: service_healthy}
  notification-worker:
    <<: *backend
    command: [python, -m, app.notification_worker]
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    image: attendance-fresh-frontend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
  nginx:
    image: nginx:1.29-alpine
    ports: ["127.0.0.1:8082:80"]
    volumes: ["./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_started}
    restart: unless-stopped

volumes:
  redis-data:
  face-models:
